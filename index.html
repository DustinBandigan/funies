
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>pee pee poo poo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff5f7;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      transition: background 0.3s;
    }

    #start, #prank {
      width: 100%;
    }

    h1 {
      font-size: clamp(24px, 6vw, 40px);
      margin-bottom: 30px;
    }

    button {
      width: 85%;
      max-width: 320px;
      padding: 20px 35px;
      font-size: 24px;
      font-weight: bold;
      background: #ff4d88;
      color: white;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }

    #prank {
      display: none;
    }

    #prank img {
      display: block;
      width: 100%;
      max-width: 500px;
      max-height: 75dvh;
      object-fit: contain;
      margin: 0 auto;
      border-radius: 12px;
    }

    body.reveal {
      background: #ff4444;
    }

    body.reveal h1 {
      color: white;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      #prank h1 {
        font-size: 28px;
      }

      #prank img {
        max-height: 70dvh;
      }
    }
  </style>
</head>

<body>

  <!-- First Screen -->
  <div id="start">
    <h1>Hello Sophia.</h1>
    <button type="button" onclick="showPrank()">
      CLICK ME!
    </button>
  </div>

  <!-- Prank Screen -->
  <div id="prank">
    <h1>tangina mo pakyu gago yawa</h1>
    <img src="middlefinger.gif"
         alt="Surprise!">
  </div>

  <!-- Prank Audio -->
  <audio id="prankSound" preload="auto">
    <source src="prank.mp3" type="audio/mpeg">
  </audio>

  <script>
    function showPrank() {
      // Hide the first screen
      document.getElementById("start").style.display = "none";

      // Show the GIF
      document.getElementById("prank").style.display = "block";

      // Change background color
      document.body.classList.add("reveal");

      // Play audio
      const audio = document.getElementById("prankSound");
      audio.currentTime = 0;

      audio.play().catch(error => {
        console.log("Audio playback failed:", error);
      });
    }
  </script>

</body>
</html>
